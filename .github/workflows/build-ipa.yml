name: Build IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Cache frameworks
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            xcfs/.build
            Frameworks/ios_system/xcfs/.build
          key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

      - name: Get frameworks
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./get_frameworks.sh

      - name: Get resources
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./get_resources.sh

      - name: Copy xcconfig
        run: cp template_setup.xcconfig developer_setup.xcconfig

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project Blink.xcodeproj \
            -scheme Blink \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            clean build \
            IPHONEOS_DEPLOYMENT_TARGET=16.1 \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -path '*/Debug-iphoneos/Blink.app' -type d -maxdepth 5 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            printf 'Blink.app was not found\n' >&2
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Blink-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blink-unsigned-ipa
          path: Blink-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-xcodebuild-log
          path: xcodebuild.log
