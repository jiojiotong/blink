name: Build IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    env:
      BUILD_CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Cache frameworks
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            xcfs/.build
            Frameworks/ios_system/xcfs/.build
          key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

      - name: Get frameworks
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./get_frameworks.sh

      - name: Get resources
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./get_resources.sh

      - name: Install signing assets
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_CERTIFICATE_P12_BASE64" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] || [ -z "$IOS_PROVISION_PROFILE_BASE64" ]; then
            printf 'Missing signing secrets. Set IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, and IOS_PROVISION_PROFILE_BASE64.\n' >&2
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/signing_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PROFILE_PLIST")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PROFILE_PLIST")
          BUNDLE_ID=${APP_IDENTIFIER#${TEAM_ID}.}

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/iPhone Distribution|Apple Distribution/ { print $2; exit }')
          if [ -z "$SIGNING_IDENTITY" ]; then
            printf 'No distribution signing identity found in p12.\n' >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi

          {
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "TEAM_ID=$TEAM_ID"
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "PROFILE_PATH=$PROFILE_PATH"
            echo "PROFILE_PLIST=$PROFILE_PLIST"
          } >> "$GITHUB_ENV"

      - name: Create signing xcconfig
        run: |
          cp template_setup.xcconfig developer_setup.xcconfig
          {
            echo ""
            echo "TEAM_ID = $TEAM_ID"
            echo "BUNDLE_ID = $BUNDLE_ID"
            echo "GROUP_ID = $BUNDLE_ID"
            echo "CLOUD_ID = $BUNDLE_ID"
            echo "KEYCHAIN_ID1 = $BUNDLE_ID"
          } >> developer_setup.xcconfig

      - name: Build unsigned app
        run: |
          set -o pipefail
          set +e
          rm -rf build/DerivedData build/Payload Blink-signed-device.ipa Blink-signed-device-app.zip
          xcodebuild \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration "$BUILD_CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=16.1 \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee xcodebuild.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            {
              echo "## xcodebuild build failed"
              echo
              echo "### Errors"
              echo '```text'
              grep -n -E "error:|Undefined symbols|ld:|clang: error|SwiftCompile|CodeSign|Provisioning profile|Signing" xcodebuild.log || true
              echo '```'
              echo
              echo "### Last log lines"
              echo '```text'
              tail -n 120 xcodebuild.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi

      - name: Verify main command symbols
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products -path "*/${BUILD_CONFIGURATION}-iphoneos/Blink.app" -type d -maxdepth 5 | /usr/bin/head -n 1)
          if [ -z "$APP_PATH" ]; then
            printf 'Blink.app was not found\n' >&2
            exit 1
          fi

          SYMBOLS_FILE="Blink/Commands/ExportedSymbols.exp"

          missing=0
          while IFS= read -r symbol; do
            symbol="${symbol#_}"
            [ -n "$symbol" ] || continue
            if ! nm -gU "$APP_PATH/Blink" | grep -q " _${symbol}$"; then
              printf 'Missing MAIN command symbol: %s\n' "$symbol" >&2
              missing=1
            fi
          done < "$SYMBOLS_FILE"

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Sign app manually
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products -path "*/${BUILD_CONFIGURATION}-iphoneos/Blink.app" -type d -maxdepth 5 | /usr/bin/head -n 1)
          if [ -z "$APP_PATH" ]; then
            printf 'Blink.app was not found\n' >&2
            exit 1
          fi

          ENTITLEMENTS_PATH="$RUNNER_TEMP/entitlements.plist"
          /usr/libexec/PlistBuddy -x -c 'Print Entitlements' "$PROFILE_PLIST" > "$ENTITLEMENTS_PATH"

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP_PATH/Info.plist"
          cp "$PROFILE_PATH" "$APP_PATH/embedded.mobileprovision"
          rm -rf "$APP_PATH/_CodeSignature" "$APP_PATH/PlugIns"

          while IFS= read -r item; do
            codesign --force --sign "$SIGNING_IDENTITY" --timestamp=none "$item"
          done < <(find "$APP_PATH" -type d -name '*.framework' -print)

          while IFS= read -r item; do
            if file "$item" | grep -q 'Mach-O'; then
              codesign --force --sign "$SIGNING_IDENTITY" --timestamp=none "$item"
            fi
          done < <(find "$APP_PATH" -type f \( -name '*.dylib' -o -perm -111 \) -print)

          codesign --force --sign "$SIGNING_IDENTITY" --entitlements "$ENTITLEMENTS_PATH" --timestamp=none "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"

      - name: Package app artifacts
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -path "*/${BUILD_CONFIGURATION}-iphoneos/Blink.app" -type d -maxdepth 5 | /usr/bin/head -n 1)
          if [ -z "$APP_PATH" ]; then
            printf 'Blink.app was not found\n' >&2
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry ../Blink-signed-device.ipa Payload)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Blink-signed-device-app.zip

      - name: Upload signed app
        uses: actions/upload-artifact@v4
        with:
          name: Blink-signed-app
          retention-days: 14
          path: |
            Blink-signed-device.ipa
            Blink-signed-device-app.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ios-signed-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            Blink-signed-device.ipa \
            Blink-signed-device-app.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "iOS signed device build #${GITHUB_RUN_NUMBER}" \
            --notes "Signed ad-hoc iOS build for commit ${GITHUB_SHA}. Install only on devices included in the provisioning profile."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-xcodebuild-log
          retention-days: 14
          path: xcodebuild.log

      - name: Build summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Signed iOS Build

          Artifact: \`Blink-signed-app\`

          Release: \`ios-signed-${GITHUB_RUN_NUMBER}\`

          Bundle ID: \`$BUNDLE_ID\`

          Profile: \`$PROFILE_NAME\`
          EOF
